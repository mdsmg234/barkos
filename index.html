<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f5bd1">
<title>BARKOS</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f6fa; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #fb { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-family: Arial, sans-serif; text-align: center; padding: 24px; color: #222; }
  #fb a { display: inline-block; margin-top: 14px; padding: 14px 24px; background: #0b5ed7; color: #fff; font-weight: bold; text-decoration: none; border-radius: 8px; }
</style>
</head>
<body>
<iframe id="app" title="BARKOS" credentialless allow="clipboard-write"></iframe>
<div id="fb"><div>BARKOS tidak dapat ditampilkan di halaman ini.<br><a id="direct" href="#" target="_top" rel="noopener">BUKA BARKOS LANGSUNG</a></div></div>
<script>
// Pembungkus alamat pendek BARKOS (GitHub Pages). Seluruh aplikasi, login & data berjalan di Google Apps Script.
// Tautan supplier: ?s=<token> atau ?p=/s/<token>. Token hanya diteruskan; validasi tetap di server BARKOS.
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbxMgHaR0is1Vh6450yR50PaX0vu_M5RkqROgC7u8NFmDtQjh0OcLYrS48sMguspAnxb0A/exec';
  var q = new URLSearchParams(location.search);
  var p = q.get('p') || '';
  var s = q.get('s');
  if (s) p = '/s/' + s;
  if (p && !/^\/(s|atur)\/[A-Za-z0-9_-]{16,80}$|^\/(akun|lupa|panduan|unduh)$/.test(p)) p = '';
  var src = EXEC + (p ? '?p=' + encodeURIComponent(p) : '');
  // Sesi BARKOS dari iframe (credentialless = tanpa cookie akun Google; penyimpanannya hilang saat refresh) disimpan di
  // sessionStorage tab ini dan dikembalikan saat iframe dimuat ulang. Hanya menerima pesan dari frame aplikasi Google.
  var KEY = 'barkos_sesi_v1';
  var okOrigin = function (o) { return /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(o); };
  window.addEventListener('message', function (e) {
    if (!okOrigin(e.origin) || !e.data || typeof e.data !== 'object') return;
    if (e.data.bk === 'hello') { var j = null; try { j = JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (_) { j = null; } e.source.postMessage({ bk: 'jar', jar: j }, e.origin); }
    if (e.data.bk === 'save' && e.data.jar && typeof e.data.jar === 'object') { try { sessionStorage.setItem(KEY, JSON.stringify(e.data.jar)); } catch (_) { /* */ } }
  });
  var f = document.getElementById('app');
  document.getElementById('direct').href = src;
  f.src = src;
  // cadangan: bila iframe tidak termuat dalam 25 detik, tampilkan tombol buka langsung
  var loaded = false; f.addEventListener('load', function () { loaded = true; });
  setTimeout(function () { if (!loaded) { f.style.display = 'none'; document.getElementById('fb').style.display = 'flex'; } }, 25000);
})();
</script>
</body>
</html>
